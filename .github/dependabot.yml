version: 2

updates:
  # pnpm workspace — one root lockfile covers apps/web, server, and
  # packages/shared, so a single entry is enough to cover the whole monorepo.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    groups:
      # Patch/minor bumps are low-risk and noisy one-at-a-time — batch them
      # into a single PR per ecosystem so review effort stays proportional
      # to actual risk. Majors are left ungrouped since they can be breaking
      # and deserve individual review.
      production-dependencies:
        dependency-type: "production"
        update-types: ["patch", "minor"]
      development-dependencies:
        dependency-type: "development"
        update-types: ["patch", "minor"]

  # Keeps the Actions themselves (checkout, setup-node, etc.) patched too —
  # an out-of-date action is as much a supply-chain risk as an npm package.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
