name: Database Backup

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC daily
  workflow_dispatch: {}    # lets you trigger a backup manually from the Actions tab

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install postgresql-client
        # Ubuntu's own apt repos lag behind Postgres's latest major release,
        # but Neon always runs current — pulling from PGDG (Postgres's own
        # apt repo) instead avoids the "server version mismatch" pg_dump
        # refuses to work around. Bump the "-18" below if Neon moves to a
        # newer major version.
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client-18
          # ubuntu-latest ships its own (older) pg_dump on PATH already, and
          # installing a second version via apt doesn't reliably win that
          # ordering — point PATH at the v18 binaries explicitly rather than
          # hoping the right one gets picked up.
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          # Prove it's actually there, in this step's own log — with
          # set -euo pipefail above, a failed apt-get install now fails this
          # step loudly instead of silently falling through to the echo.
          /usr/lib/postgresql/18/bin/pg_dump --version

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail
          : "${DATABASE_URL:?NEON_DATABASE_URL secret is not set or empty}"
          echo "Using $(command -v pg_dump): $(pg_dump --version)"
          mkdir -p dump
          FILE="pawcare-$(date -u +'%Y-%m-%d_%H%M%S').dump"
          pg_dump "$DATABASE_URL" --format=custom --no-owner --no-privileges --file="dump/$FILE"
          # Abort before upload rather than silently archiving a broken/empty dump
          [ -s "dump/$FILE" ] || { echo "::error::pg_dump produced an empty file"; exit 1; }
          echo "DUMP_FILE=$FILE" >> "$GITHUB_ENV"

      - name: Upload backup
        # Cloudflare R2 speaks the S3 API, so the pre-installed `aws` CLI works
        # against it directly — no AWS account, IAM role, or AWS-specific
        # action needed. It reads credentials from these standard env var
        # names on its own; "auto" is Cloudflare's documented region value
        # for R2 (R2 buckets aren't region-scoped the way S3 buckets are).
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    auto
          ENDPOINT:              ${{ secrets.BACKUP_R2_ENDPOINT }}
          BUCKET:                ${{ secrets.BACKUP_R2_BUCKET }}
        run: |
          set -euo pipefail
          : "${AWS_ACCESS_KEY_ID:?BACKUP_R2_ACCESS_KEY_ID secret is not set or empty}"
          : "${AWS_SECRET_ACCESS_KEY:?BACKUP_R2_SECRET_ACCESS_KEY secret is not set or empty}"
          : "${ENDPOINT:?BACKUP_R2_ENDPOINT secret is not set or empty}"
          : "${BUCKET:?BACKUP_R2_BUCKET secret is not set or empty}"

          aws s3 cp "dump/$DUMP_FILE" "s3://$BUCKET/db-backups/daily/$DUMP_FILE" --endpoint-url "$ENDPOINT"

          # Keep an indefinite monthly snapshot alongside the daily rotation.
          # The daily/ prefix expires on its own via an R2 object lifecycle
          # rule (configured on the bucket, not here) — no delete logic to maintain.
          if [ "$(date -u +'%d')" = "01" ]; then
            aws s3 cp "dump/$DUMP_FILE" "s3://$BUCKET/db-backups/monthly/$DUMP_FILE" --endpoint-url "$ENDPOINT"
          fi
